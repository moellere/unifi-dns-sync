# Default values for unifi-dns-sync.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/moellere/unifi-dns-sync
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

syncIntervalSeconds: 3600

persistence:
  enabled: false
  storageClass: ""
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  # Annotations for the PVC
  annotations: {}
  # Use an existing PVC instead of creating one
  existingClaim: ""

# Name of an existing Secret containing a `controllers.json` key.
# Use this to keep controller API keys out of Helm values (e.g. manage the
# Secret with sealed-secrets, SOPS, or external-secrets). When set, the chart
# does not render its own credentials Secret and `controllers` below is ignored.
# The Secret must contain a key named `controllers.json` whose value is the
# JSON array described in the README.
existingSecret: ""

# List of controllers (rendered into a chart-managed Secret).
# WARNING: api_key values set here end up in your Helm values (and your git
# history if you commit them). Prefer existingSecret above for real deployments.
# Example:
# controllers:
#   - host: "10.0.0.1"
#     api_key: "YOUR_API_KEY"
#     site: "default"
#     sync_dhcp_clients: true
#     domain_suffix: "home.arpa"
#     allowed_record_types: ["A_RECORD", "CNAME_RECORD"]
#     authoritative_subnets: ["10.0.0.0/16"]
#     verify_ssl: false
controllers: []

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

webUi:
  enabled: true
  port: 5000
  service:
    type: ClusterIP
    port: 80

gateway:
  enabled: false
  create: false
  host: dns-sync.mydomain.com
  # className: traefik
  # name: unifi-dns-sync
  # namespace: default

nodeSelector: {}

tolerations: []

affinity: {}
